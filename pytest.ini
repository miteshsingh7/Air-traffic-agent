[pytest]
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:.*'app' shortcut is deprecated.*:DeprecationWarning
    ignore:.*transport=ASGITransport.*:DeprecationWarning
    ignore::DeprecationWarning:httpx
    ignore::DeprecationWarning:starlette
    ignore:.*Could not fully parse config.*:UserWarning
